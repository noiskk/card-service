spring:
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  client:
    # 레지스트리 자신은 자기한테 등록하지 않는다
    register-with-eureka: false
    fetch-registry: false
  server:
    # 죽은 인스턴스를 빨리 걷어내도록 로컬 개발용으로 짧게 잡는다(운영 기본값은 훨씬 길다)
    eviction-interval-timer-in-ms: 5000
    enable-self-preservation: false

logging:
  level:
    com.netflix.eureka: INFO
