# MySQL 없이 바로 띄워보기 위한 프로파일 (H2 인메모리).
# 실행: sh gradlew bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  sql:
    init:
      mode: always
      encoding: UTF-8

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
