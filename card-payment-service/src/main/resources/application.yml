spring:
  application:
    name: card-payment-service

  # Feign 타임아웃 — 응답 없는 하위 서비스에 매달려 있지 않게 한다.
  # 타임아웃이 나야 '불확실 거래'로 분류되고 대사 대상이 된다.
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

  
  datasource:
    url: jdbc:mysql://localhost:3306/card_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
      encoding: UTF-8

  batch:
    jdbc:
      # 배치 메타데이터 테이블(BATCH_JOB_INSTANCE 등) 자동 생성
      initialize-schema: always
    job:
      # 부팅하자마자 Job이 돌면 안 된다. 스케줄러/수동 트리거로만 실행한다.
      enabled: false

server:
  port: 9091
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.card.payment: DEBUG

# 은행(외부 회사) — 서비스 디스커버리 대상이 아니라 고정 엔드포인트로 연동
bank:
  service:
    url: http://localhost:8080

# 카드사 내부 서비스
fds:
  service:
    url: http://localhost:9090

ledger:
  service:
    url: http://localhost:9094

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

# 카드사 내부 서비스 레지스트리
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 20

