spring:
  application:
    name: card-fds-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/card_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 9090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.card.payment: DEBUG

# 은행 서비스 설정
bank:
  service:
    url: http://localhost:8080

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

# 카드사 내부 서비스 레지스트리
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 20

# 이상거래 탐지 룰 임계치
# 실무에서 임계치는 오탐률을 보며 계속 조정되므로 배포 없이 바꿀 수 있어야 한다.
fds:
  rule:
    block-threshold: 70          # 이 점수 이상이면 차단
    review-threshold: 40         # 이 점수 이상이면 승인하되 검토 대상 표시

    velocity-window-minutes: 1
    velocity-max-count: 3        # 이번 거래 포함 4건째부터 적발
    velocity-score: 60

    testing-window-minutes: 1
    testing-amount-under: 10000
    testing-max-count: 2         # 소액 3건째부터 적발
    testing-score: 50

    amount-window-minutes: 10
    amount-max-total: 3000000
    amount-score: 50

    diversity-window-minutes: 5
    diversity-max-merchants: 2   # 3곳째부터 적발
    diversity-score: 40

    anomaly-min-history: 3       # 프로파일 표본이 이보다 적으면 판정 보류
    anomaly-multiplier: 5
    anomaly-score: 30

    midnight-from-hour: 0
    midnight-to-hour: 6
    midnight-amount-over: 1000000
    midnight-score: 25
